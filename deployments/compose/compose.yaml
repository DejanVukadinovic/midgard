# MIDGARD local stack. Default services: postgres, core, example service, edge.
# Profiles:  zitadel  real ZITADEL v2 (default for the root compose.yaml; a bootstrap job publishes ids to the `idp` volume)
#            dev-idp  offline development identity provider (default for `make dev-up`)
#            demo     sample application facade
# Only `edge` publishes a port, bound to loopback. Credentials come from ./.secrets (git-ignored,
# generated by gen-dev-secrets.sh) — never from this file.
name: midgard

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [platform]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set in .env}
    restart: unless-stopped
    networks: [platform]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets: [pg_superuser_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # Idempotent role/database reconciliation (runs on every `up`, not only first start).
  db-init:
    image: ${POSTGRES_IMAGE}
    restart: "no"
    networks: [platform]
    depends_on: {postgres: {condition: service_healthy}}
    env_file: [.secrets/db-init.env]
    secrets: [pg_superuser_password]
    volumes: ["./init/postgres:/init:ro"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - 'export PGPASSWORD="$$(cat /run/secrets/pg_superuser_password)"; PSQL_ADMIN="psql -v ON_ERROR_STOP=1 -q -h postgres -U postgres" /init/01-roles-and-databases.sh'

  core-migrate:
    <<: *hardening
    restart: "no"
    image: midgard/platform-core:dev
    build: {context: ../.., dockerfile: deployments/docker/Dockerfile.rust, target: platform-core}
    entrypoint: ["/usr/local/bin/with-idp-env", "/usr/local/bin/platform-core"]
    command: ["migrate"]
    volumes: [idp:/idp:ro]
    depends_on: {db-init: {condition: service_completed_successfully}}
    environment: &core-env
      ZITADEL_ISSUER: ${IDP_ISSUER}
      PLATFORM_AUDIENCE: ${PLATFORM_AUDIENCE}
      PLATFORM_ACCEPT_JWT_TYP: ${PLATFORM_ACCEPT_JWT_TYP:-false}
      PLATFORM_OPERATOR_SUBJECTS: ${PLATFORM_OPERATOR_SUBJECTS}
      PLATFORM_PUBLISHER_SUBJECTS: ${PLATFORM_PUBLISHER_SUBJECTS}
      PLATFORM_DATABASE_URL_FILE: /run/secrets/core_db_url
      PLATFORM_MIGRATION_DATABASE_URL_FILE: /run/secrets/core_migration_db_url
      REGISTRY_HEALTH_CHECK_INTERVAL_SECONDS: ${REGISTRY_HEALTH_CHECK_INTERVAL_SECONDS}
      REGISTRY_RESOLUTION_TTL_SECONDS: ${REGISTRY_RESOLUTION_TTL_SECONDS}
      RUST_LOG: ${RUST_LOG}
    secrets: [core_db_url, core_migration_db_url]

  platform-core:
    <<: *hardening
    image: midgard/platform-core:dev
    entrypoint: ["/usr/local/bin/with-idp-env", "/usr/local/bin/platform-core"]
    command: ["serve"]
    volumes: [idp:/idp:ro]
    depends_on:
      core-migrate: {condition: service_completed_successfully}
      zitadel-bootstrap: {condition: service_completed_successfully, required: false}
    environment: *core-env
    secrets: [core_db_url, core_migration_db_url]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  capability-migrate:
    <<: *hardening
    restart: "no"
    image: midgard/example-capability:dev
    build: {context: ../.., dockerfile: deployments/docker/Dockerfile.rust, target: example-capability}
    command: ["migrate"]
    depends_on: {db-init: {condition: service_completed_successfully}}
    environment:
      CAPABILITY_DATABASE_URL_FILE: /run/secrets/capability_db_url
      CAPABILITY_MIGRATION_DATABASE_URL_FILE: /run/secrets/capability_migration_db_url
    secrets: [capability_db_url, capability_migration_db_url]

  example-capability:
    <<: *hardening
    image: midgard/example-capability:dev
    entrypoint: ["/usr/local/bin/with-idp-env", "/usr/local/bin/example-capability"]
    volumes: [idp:/idp:ro]
    depends_on:
      capability-migrate: {condition: service_completed_successfully}
      platform-core: {condition: service_healthy}
    environment:
      # With ZITADEL the ids/secrets come from the idp volume (CAPABILITY_AUDIENCE has the same name there).
      IDP_ENV_MAP: "CAPABILITY_CORE_AUDIENCE=PLATFORM_AUDIENCE CAPABILITY_CLIENT_SECRET=SECRET_EXAMPLE_DEPLOYER"
      CAPABILITY_ACCEPT_JWT_TYP: ${PLATFORM_ACCEPT_JWT_TYP:-false}
      CAPABILITY_ISSUER: ${IDP_ISSUER}
      CAPABILITY_TOKEN_URL: ${IDP_TOKEN_URL}
      CAPABILITY_AUDIENCE: platform.example
      CAPABILITY_DATABASE_URL_FILE: /run/secrets/capability_db_url
      PLATFORM_CORE_URL: http://platform-core:8080
      CAPABILITY_CLIENT_ID: example-deployer
      CAPABILITY_CLIENT_SECRET: dev-only-deployer   # dev-idp fixture; with ZITADEL use a *_FILE secret instead
      CAPABILITY_SELF_REGISTER: "true"
      CAPABILITY_PUBLIC_ENDPOINT: http://example-capability:8080   # stable Compose DNS name, never an IP
      RUST_LOG: ${RUST_LOG}
    secrets: [capability_db_url]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  edge:
    image: ${TRAEFIK_IMAGE}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [platform, public]
    depends_on: {platform-core: {condition: service_healthy}}
    ports: ["127.0.0.1:8088:8088"]
    volumes:
      - ./edge/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./edge/dynamic.yml:/etc/traefik/dynamic.yml:ro

  dev-idp:
    <<: *hardening
    profiles: [dev-idp, demo]
    image: midgard/dev-idp:dev
    build: {context: ../.., dockerfile: deployments/docker/Dockerfile.rust, target: dev-idp}
    environment:
      DEV_IDP_ISSUER: http://dev-idp:9000
      DEV_IDP_CONFIG: /etc/dev-idp/dev-idp.json
      DEV_IDP_BIND: 0.0.0.0:9000
    volumes: ["./dev-idp.json:/etc/dev-idp/dev-idp.json:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ZITADEL (pinned in .env). Follows the supported start-from-init flow: the init step uses the PostgreSQL admin
  # login, FirstInstance creates a machine user whose PAT is written to the `zitadel-admin` volume for the bootstrap job.
  # Issuer = http://zitadel:8080 (Compose DNS name; ZITADEL routes by Host, so clients must use this name).
  zitadel:
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [platform]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    profiles: [zitadel, test]
    image: ${ZITADEL_IMAGE}
    user: "0"                      # the PAT file is written into a fresh named volume
    command: start-from-init --masterkeyFile /run/secrets/zitadel_masterkey --tlsMode disabled
    depends_on: {db-init: {condition: service_completed_successfully}}
    env_file: [.secrets/zitadel.env]
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: zitadel
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_PORT: "8080"
      ZITADEL_TLS_ENABLED: "false"   # also read by `zitadel ready` (healthcheck), which otherwise probes https://
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: midgard-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: midgard-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-admin/admin.pat
      # Instance id generation needs a machine identifier; the hostname works in containers without a private IP.
      ZITADEL_MACHINE_IDENTIFICATION_HOSTNAME_ENABLED: "true"
      ZITADEL_MACHINE_IDENTIFICATION_PRIVATEIP_ENABLED: "false"
      ZITADEL_MACHINE_IDENTIFICATION_WEBHOOK_ENABLED: "false"
    secrets: [zitadel_masterkey]
    volumes: [zitadel-admin:/zitadel-admin]
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 768m

  # One-shot and idempotent: projects, orgs, grants, machine/human users, OIDC apps -> ids in the `idp` volume.
  zitadel-bootstrap:
    restart: "no"
    networks: [platform]
    profiles: [zitadel, test]
    image: midgard/tools:dev     # built once by the root compose.yaml's `bootstrap` service (two builds of one tag race)
    user: "0"                      # writes the shared volume; files are made world-readable inside it
    command: ["scripts/zitadel-bootstrap.sh"]
    depends_on: {zitadel: {condition: service_healthy}}
    environment:
      ZITADEL_URL: http://zitadel:8080
      ZITADEL_PAT_FILE: /zitadel-admin/admin.pat
      OUT_DIR: /idp
      OUT_READABLE: "1"
    volumes: [zitadel-admin:/zitadel-admin:ro, idp:/idp]
    tmpfs: [/tmp]

  sample-application:
    <<: *hardening
    profiles: [demo]
    image: midgard/sample-application:dev
    build: {context: ../.., dockerfile: deployments/docker/Dockerfile.sample-application}
    depends_on: {platform-core: {condition: service_healthy}}
    environment:
      MIDGARD_REGISTRY_URL: http://platform-core:8080
      MIDGARD_TOKEN_URL: ${IDP_TOKEN_URL}
      MIDGARD_CLIENT_ID: obroklik-backend
      MIDGARD_CLIENT_SECRET: dev-only-obroklik   # dev-idp fixture
      MIDGARD_ENVIRONMENT: local

networks:
  platform: {internal: true}
  public: {}

volumes:
  pgdata:
  zitadel-admin:   # ZITADEL's admin PAT (only the bootstrap job mounts it)
  idp:             # ids/audiences/secrets published by zitadel-bootstrap (dev credentials; internal volume)

secrets:
  pg_superuser_password: {file: .secrets/pg_superuser_password}
  core_db_url: {file: .secrets/core_db_url}
  core_migration_db_url: {file: .secrets/core_migration_db_url}
  capability_db_url: {file: .secrets/capability_db_url}
  capability_migration_db_url: {file: .secrets/capability_migration_db_url}
  zitadel_masterkey: {file: .secrets/zitadel_masterkey}
