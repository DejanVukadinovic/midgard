# MIDGARD synthetic-fixture NATS JetStream configuration (broker-enforced authorization).
# Passwords and the store dir come from the environment; see compose.yaml and .env.example.
# Identity-to-tenant binding: a client may publish only to its own `example.echo.submit.<app>`
# subject, so the provider derives the calling application from the subject, never from headers.
server_name: midgard-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222        # monitoring (/healthz); not published to the host

jetstream {
  store_dir: $NATS_STORE_DIR
  max_file_store: 1G
}


accounts {
  MIDGARD {
    jetstream: enabled
    users = [
      # Provisioning identity: creates the stream and consumers. Not used at runtime by services.
      {
        user: "admin", password: $NATS_ADMIN_PASSWORD
        permissions: {
          publish: ["$JS.API.>", "$JS.ACK.>", "example.>"]
          subscribe: ["_INBOX.>"]
        }
      }
      # Synthetic provider: consume its durable consumer, publish dead letters.
      {
        user: "provider", password: $NATS_PROVIDER_PASSWORD
        permissions: {
          publish: [
            "$JS.API.STREAM.INFO.EXAMPLE",
            "$JS.API.CONSUMER.INFO.EXAMPLE.provider-submit",
            "$JS.API.CONSUMER.MSG.NEXT.EXAMPLE.provider-submit",
            "$JS.ACK.EXAMPLE.provider-submit.>",
            "example.echo.dead.submit"
          ]
          subscribe: ["_INBOX.>"]
        }
      }
      # Synthetic client application "obroklik": publish only to its own subject.
      {
        user: "client-obroklik", password: $NATS_CLIENT_PASSWORD
        permissions: {
          publish: ["$JS.API.STREAM.INFO.EXAMPLE", "example.echo.submit.obroklik"]
          subscribe: ["_INBOX.>"]
        }
      }
    ]
  }
  SYS { users = [ { user: "sys", password: $NATS_ADMIN_PASSWORD } ] }
}
system_account: SYS
