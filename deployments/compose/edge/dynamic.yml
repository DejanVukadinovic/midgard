http:
  routers:
    platform:
      rule: "Host(`platform.localhost`) && (PathPrefix(`/v0`) || PathPrefix(`/health`))"   # /metrics is NOT routed
      entryPoints: [web]
      service: platform-core
  services:
    platform-core:
      loadBalancer:
        servers:
          - url: "http://platform-core:8080"
