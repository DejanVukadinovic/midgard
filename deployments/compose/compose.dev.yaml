# Local-development convenience ONLY: publishes loopback-bound ports so host tooling and the
# acceptance script can reach the dev IdP and the sample service directly. Never use in production.
# Ports cannot be published from containers attached only to an `internal` network, so these two
# services are additionally attached to the non-internal `public` network here.
services:
  dev-idp:
    networks: [platform, public]
    ports: ["127.0.0.1:9000:9000"]
  example-capability:
    networks: [platform, public]
    ports: ["127.0.0.1:8082:8080"]
