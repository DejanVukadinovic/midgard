name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # scan the full history, not only the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  rust-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2   # advisories + licenses + bans + sources
  go-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "stable"}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: cd sdk/go && govulncheck ./...
      - run: cd examples/sample-application && govulncheck ./...
  config-and-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master   # TODO pin to a release tag/SHA (tag format 0.28.0 did not resolve)
        with:
          scan-type: config
          scan-ref: deployments
          severity: HIGH,CRITICAL
          exit-code: "1"
