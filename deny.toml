# cargo-deny: license and advisory policy. Run with `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# serde_yaml (deprecated) -> unsafe-libyaml is unmaintained; no safe upgrade exists. Input is size-limited (2 MiB)
# and only accepted from authorized publishers. Tracked tech debt: migrate to a maintained YAML parser.
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5 timing variability): reachable only through p256 in platform-testkit / dev-idp, i.e. the
# offline development IdP and test fixtures that sign with throwaway keys. No production path uses it; p256 0.13 has no release on
# crypto-bigint >= 0.7. Revisit when p256 0.14 is stable.
ignore = ["RUSTSEC-2024-0449", "RUSTSEC-2026-0387"]

[licenses]
version = 2
allow = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
  "MPL-2.0", "CC0-1.0", "OpenSSL", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
