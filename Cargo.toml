[workspace]
resolver = "3"
members = [
  "crates/platform-http",
  "crates/platform-auth",
  "crates/platform-persistence",
  "crates/platform-contracts",
  "crates/platform-messaging",
  "crates/platform-testkit",
  "services/platform-core",
  "services/example-capability",
  "tools/dev-idp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/dejanvukadinovic/midgard"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
http = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

platform-http = { path = "crates/platform-http", version = "0.1.0" }
platform-auth = { path = "crates/platform-auth", version = "0.1.0" }
platform-persistence = { path = "crates/platform-persistence", version = "0.1.0" }
platform-contracts = { path = "crates/platform-contracts", version = "0.1.0" }
platform-testkit = { path = "crates/platform-testkit", version = "0.1.0" }
platform-messaging = { path = "crates/platform-messaging", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 4
